[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-recognition"
version = "0.1.0"
description = "Modular OCR Text Recognition Project"
readme = "README.md"
authors = [
    { name = "steve", email = "Ltien540@gmail.com" }
]
requires-python = ">=3.10,<3.13"
dependencies = [
    "albumentations>=1.4.0",
    "datasets>=2.18.0",
    "editdistance>=0.8.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.4.0",
    "setuptools<70.0.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.66.0",
    "transformers>=4.38.0",
    "vietocr>=0.3.12",
    "wandb>=0.16.0",
    "onnx>=1.15.0",
    "onnxruntime>=1.17.0; sys_platform == 'darwin'",
    "onnxruntime-gpu>=1.17.0; sys_platform == 'linux'",
    "onnxslim>=0.1.34",
    "tensorrt-cu12>=10.0.0; sys_platform == 'linux'",
    "tensorrt-cu12-bindings>=10.0.0; sys_platform == 'linux'",
    "tensorrt-cu12-libs>=10.0.0; sys_platform == 'linux'",
    "onnxscript>=0.7.2",
    "nvidia-cublas-cu12>=12.1.3.1; sys_platform == 'linux'",
    "nvidia-cudnn-cu12>=9.0.0.0; sys_platform == 'linux'",
]

[tool.setuptools.packages.find]
where = ["."]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
