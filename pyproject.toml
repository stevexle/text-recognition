[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "text-recognition"
version = "0.1.0"
description = "Modular OCR Text Recognition Project"
readme = "README.md"
authors = [
    { name = "steve", email = "Ltien540@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "albumentations>=1.4.0",
    "datasets>=2.18.0",
    "editdistance>=0.8.0",
    "pandas>=2.0.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "rich>=13.0.0",
    "scikit-learn>=1.4.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "tqdm>=4.66.0",
    "transformers>=4.38.0",
    "wandb>=0.16.0",
]

[tool.setuptools.packages.find]
where = ["."]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
  { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
